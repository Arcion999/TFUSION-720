name: CodeQL

on:
  push:
    branches:
      - main
      - milestone/01-foundation
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  codeql-csharp:
    name: codeql-csharp
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp

      - name: Locked restore
        run: dotnet restore TFUSION-720.sln --locked-mode

      - name: Build
        run: dotnet build TFUSION-720.sln --configuration Release --no-restore --property:Platform=x64

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:csharp

  codeql-cpp:
    name: codeql-cpp
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      TFUSION_VCPKG_BINARY_CACHE: ${{ github.workspace }}\.tools\vcpkg-binary-cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore native binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.tools\vcpkg-binary-cache
          key: vcpkg-x64-windows-${{ hashFiles('native/TFusion.Kernel.Native/vcpkg.json') }}
          save-always: true

      - name: Prepare native dependencies outside CodeQL tracing
        shell: pwsh
        run: ./eng/native-build.ps1 -ConfigureOnly

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: cpp

      - name: Rebuild project-owned native bridge for CodeQL
        shell: pwsh
        run: ./eng/native-build.ps1 -SkipTests -SkipInstall -Rebuild

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:cpp
